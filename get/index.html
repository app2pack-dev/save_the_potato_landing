<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Get Save The Potato</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Download Save The Potato on Google Play or the App Store.">
  <link rel="icon" type="image/png" href="../assets/logo-64x64.png" sizes="64x64">
  <link rel="canonical" href="https://savethepotato.com/get/">
  <script>
    (function () {
      var PLAY = 'https://play.google.com/store/apps/details?id=dev.app2pack.savethepotato';
      var APP_STORE = 'https://apps.apple.com/app/save-the-potato/id6474765181';
      var ua = navigator.userAgent || '';
      // iPadOS reports itself as a Mac, so also check for touch.
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
        (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      if (isIOS) location.replace(APP_STORE);
      else if (isAndroid) location.replace(PLAY);
      else location.replace('/');
    })();
  </script>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      background: #010B31;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
    }
    img.logo { width: 200px; height: 200px; border-radius: 0; }
    h1 { font-size: 28px; margin: 24px 0; }
    .stores { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .stores img { height: 52px; }
    a.home { color: #9cc7ff; margin-top: 24px; font-size: 14px; }
  </style>
</head>
<body>
  <img class="logo" src="../assets/logo.png" alt="Save The Potato">
  <h1>Save The Potato</h1>
  <div class="stores">
    <a href="https://play.google.com/store/apps/details?id=dev.app2pack.savethepotato"><img src="../assets/google-play.png" alt="Get it on Google Play"></a>
    <a href="https://apps.apple.com/app/save-the-potato/id6474765181"><img src="../assets/app-store.png" alt="Download on the App Store"></a>
  </div>
  <a class="home" href="../">savethepotato.com</a>
</body>
</html>
